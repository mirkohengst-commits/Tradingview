name: Signalstation Watcher

on:
  schedule:
    # Alle 30 Minuten. GitHub garantiert keine exakte Sekunde — bei hoher Auslastung
    # kann sich ein Lauf um ein paar Minuten verschieben, das ist normal und kein Fehler.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # manueller "Run workflow"-Knopf zum Testen

permissions:
  contents: write   # nötig, damit der Bot state.json zurückcommitten darf

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Watcher ausführen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          VS_CURRENCY: eur
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # optional -- leer lassen, wenn nicht genutzt
          GEMINI_MODEL: gemini-3.5-flash                  # bei Bedarf hier zentral anpassen
        run: python watcher.py

      - name: state.json zurückcommitten (nur falls geändert)
        run: |
          git config user.name "signalstation-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- state.json; then
            git add state.json
            git commit -m "state update [skip ci]"
            git push
          else
            echo "Keine Änderung an state.json, kein Commit nötig."
          fi
